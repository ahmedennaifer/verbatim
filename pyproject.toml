[project]
name = "verbatim"
version = "0.1.0"
description = "Agent that answers questions about product reviews with SQL, code and files"
requires-python = ">=3.14"
dependencies = [
    "langchain-google-genai>=4.4.0",
    "langchain-groq>=1.1.3",
    "langgraph>=1.2.12",
    "psycopg[binary]>=3.2",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "pyyaml>=6.0.3",
]

[dependency-groups]
dev = [
    "langgraph-cli[inmem]>=0.4.32",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 120
extend-exclude = ["sandbox", "workspace", "data"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.pyright]
venvPath = "."
venv = ".venv"
include = ["agent", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["integration: needs the local reviews database and the code sandbox"]
